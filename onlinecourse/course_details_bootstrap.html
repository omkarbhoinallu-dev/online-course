<form id="questionform" action="{% url 'onlinecourse:submit' course.id %}" method="post">
    {% csrf_token %}
    {% for lesson in course.lesson_set.all %}
        {% for question in lesson.question_set.all %}
            <div class="card mt-2">
                <div class="card-header"><h5>{{ question.question_text }}</h5></div>
                <div class="card-body">
                    {% for choice in question.choice_set.all %}
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="choice_{{ choice.id }}" value="{{ choice.id }}" id="choice_{{ choice.id }}">
                            <label class="form-check-label" for="choice_{{ choice.id }}">
                                {{ choice.choice_text }}
                            </label>
                        </div>
                    {% endfor %}
                </div>
            </div>
        {% endfor %}
    {% endfor %}
    <input class="btn btn-success btn-block mt-3" type="submit" value="Submit">
</form>
